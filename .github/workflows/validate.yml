name: validate

# 校验 game-fit-advisor 与 github-skill-publisher 两个技能包：
# 结构一致性、单元测试、以及关键行为的冒烟测试。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate game-fit-advisor (frontmatter, files, key/weight consistency)
        run: python game-fit-advisor/scripts/validate_skill.py game-fit-advisor

      - name: Run game-fit-advisor tests
        run: python -m unittest discover -s game-fit-advisor/scripts -p "test_*.py" -v

      - name: Smoke test — all matches must be high fit
        run: |
          python game-fit-advisor/scripts/diagnose.py --game "smoke-high" --mode 1 \
            --answers "core_loop:match,controls:match,pace:match,social:match,challenge:match,content:match,immersion:match,time_budget:match" \
            --non-interactive --json > high.json
          cat high.json
          grep -q '"level": "high"' high.json
          grep -q '"percent": 100.0' high.json

      - name: Smoke test — critical conflict must not be high fit
        run: |
          python game-fit-advisor/scripts/diagnose.py --game "smoke-critical" --mode 2 \
            --answers "time_cost:match,hardware:match,payment:match,community:match,update:match,emotion:match,retention:match,values:conflict" \
            --non-interactive --json > critical.json
          cat critical.json
          grep -q '"level": "medium"' critical.json
          grep -q '"critical_conflicts": \[' critical.json

      - name: Run github-skill-publisher tests
        run: python -m unittest discover -s github-skill-publisher/scripts -p "test_*.py" -v

      - name: Smoke test — precheck passes on this repository
        run: python github-skill-publisher/scripts/precheck.py --repo .
